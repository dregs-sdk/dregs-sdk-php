# Publishes to Packagist when a GitHub Release is published, matching how dregs-mcp releases.
#
# There is no artifact to upload. Packagist builds the package from the git tag itself, so this
# workflow's job is to verify that what the tag points at is publishable and then tell Packagist
# to look. The repository's Packagist webhook normally does that on its own; the explicit call
# here makes the release deterministic rather than dependent on a hook firing.
#
# Two repository secrets are required, scoped to the `packagist` environment:
#
#   PACKAGIST_USERNAME  the Packagist account that maintains dregs/dregs-sdk
#   PACKAGIST_TOKEN     that account's API token, from https://packagist.org/profile/
#
# The `packagist` environment is the approval gate: a release cannot reach Packagist without
# whoever is named as its reviewer signing off. A version cannot be unpublished once it is taken,
# which is why the tag and the packaged version are checked before anything is announced.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # A tag that disagrees with the packaged version would publish something other than what
      # the release notes describe. Packagist reads the version from the tag, so the constant in
      # the source — which is what the User-Agent reports — has to agree with it.
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(php -r 'require "vendor/autoload.php"; echo Dregs\Client::VERSION;')
          tag="${GITHUB_REF_NAME#v}"
          echo "Dregs\\Client::VERSION=$version tag=$tag"
          test "$version" = "$tag"

      - name: Test
        run: vendor/bin/phpunit

      - name: Build the archive
        run: composer archive --format=tar --file=dregs-sdk --dir=dist

      - name: Install the archive into a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tar -xf dist/dregs-sdk.tar -C "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          composer install --no-dev --no-interaction --no-progress
          php -r '
            require "vendor/autoload.php";
            new Dregs\Client("sk_0123456789abcdefghijklmnopqrst");
            echo "dregs/dregs-sdk ", Dregs\Client::VERSION, " loads cleanly.", PHP_EOL;
          '

  publish:
    name: Notify Packagist
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: packagist
      url: https://packagist.org/packages/dregs/dregs-sdk
    steps:
      # Packagist pulls the tag itself; this only asks it to do so now rather than whenever its
      # own crawler next comes round.
      - name: Ask Packagist to update the package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /tmp/packagist.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"repository":{"url":"https://github.com/dregs-sdk/dregs-sdk-php"}}' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}")

          cat /tmp/packagist.json
          echo

          test "$status" = "202"
